<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamJai OS — Global Rural WASH, Multi-Standard OCR & Interactive Playbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <style>
    :root {
      --bg-top:#e2eaf2; --bg-mid:#edf2f7; --bg-bot:#e4ece9;
      --surface:rgba(255,255,255,0.96); --solid:#ffffff; --soft:#f8fafc; --muted-bg:#f1f5f9;
      --border:#cbd5e1; --border-st:#94a3b8;
      --ink:#0f172a; --ink-soft:#334155; --muted:#64748b;
      --brand:#0369a1; --brand-dk:#075985; --brand-soft:#e0f2fe;
      --crit:#dc2626; --crit-soft:#fef2f2; --crit-bd:#fca5a5;
      --warn:#d97706; --warn-soft:#fffbeb; --warn-bd:#fcd34d;
      --good:#059669; --good-soft:#ecfdf5; --good-bd:#6ee7b7;
      --shadow:0 4px 20px rgba(15,23,42,0.08),0 1px 3px rgba(15,23,42,0.06);
      --font:"Plus Jakarta Sans","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body.is-night {
      --bg-top:#070e1a; --bg-mid:#0b1526; --bg-bot:#0f1d32;
      --surface:rgba(15,23,42,0.95); --solid:#0f172a; --soft:#162235; --muted-bg:#1e293b;
      --border:#293952; --border-st:#475569;
      --ink:#f8fafc; --ink-soft:#cbd5e1; --muted:#94a3b8;
      --brand:#38bdf8; --brand-dk:#0284c7; --brand-soft:rgba(56,189,248,0.14);
      --crit:#ef4444; --crit-soft:rgba(239,68,68,0.14); --crit-bd:rgba(248,113,113,0.45);
      --warn:#f59e0b; --warn-soft:rgba(245,158,11,0.14); --warn-bd:rgba(251,191,36,0.45);
      --good:#10b981; --good-soft:rgba(16,185,129,0.14); --good-bd:rgba(52,211,153,0.45);
      --shadow:0 10px 32px rgba(2,6,23,0.65);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:var(--font); color:var(--ink); font-variant-numeric:tabular-nums; background-color:var(--bg-mid); background-image:linear-gradient(rgba(148,163,184,0.12) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,0.12) 1px,transparent 1px),linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 54%,var(--bg-bot) 100%); background-size:36px 36px,36px 36px,100% 100%; -webkit-font-smoothing:antialiased; user-select:none; }
    #app-shell { position:relative; width:100vw; height:100vh; overflow:hidden; }
    #map-canvas-wrap { position:absolute; inset:0; cursor:grab; z-index:1; }
    #map-canvas-wrap canvas { display:block; width:100%; height:100%; }
    #fallback-map { display:none; position:absolute; inset:0; align-items:center; justify-content:center; z-index:1; }

    #field-lite-board { display:none; position:absolute; inset:0; z-index:8; overflow-y:auto; padding:94px 16px 28px; background:var(--soft); user-select:text; }
    body.is-field-lite #field-lite-board { display:block; }
    body.is-field-lite #map-canvas-wrap, body.is-field-lite #pins-layer, body.is-field-lite .bottom-dock, body.is-field-lite #left-queue-panel, body.is-field-lite #btn-reopen-queue { display:none !important; }
    .lite-grid { max-width:1040px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; }
    .lite-card { background:var(--solid); border:1px solid var(--border); border-left:4px solid var(--border-st); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); }
    .lite-card.critical{border-left-color:var(--crit);} .lite-card.warning{border-left-color:var(--warn);} .lite-card.good{border-left-color:var(--good);}
    .lite-big-btn { font:inherit; font-size:12.6px; font-weight:700; padding:10px 12px; border-radius:8px; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; width:100%; }

    #pins-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
    .village-pin { position:absolute; left:0; top:0; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; will-change:transform; }
    .village-pin.is-selected .pin-card { box-shadow:0 0 0 2px var(--brand),0 8px 20px rgba(15,23,42,0.24); }
    .village-pin.is-dimmed { opacity:0.38 !important; }
    .pin-card { display:flex; align-items:center; gap:8px; background:var(--solid); border:1px solid var(--border); border-left:3.5px solid var(--border-st); border-radius:8px; padding:5px 10px 5px 7px; box-shadow:0 4px 14px rgba(15,23,42,0.16); white-space:nowrap; }
    .village-pin[data-status="critical"] .pin-card{border-left-color:var(--crit);} .village-pin[data-status="warning"] .pin-card{border-left-color:var(--warn);} .village-pin[data-status="good"] .pin-card{border-left-color:var(--good);} .village-pin[data-repairing="true"] .pin-card{border-left-color:var(--brand);}
    .pin-rank { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; border-radius:5px; font-size:10.5px; font-weight:800; color:#fff; }
    .village-pin[data-status="critical"] .pin-rank{background:var(--crit);} .village-pin[data-status="warning"] .pin-rank{background:var(--warn);} .village-pin[data-status="good"] .pin-rank{background:var(--good);} .village-pin[data-repairing="true"] .pin-rank{background:var(--brand);}
    .pin-text { display:flex; flex-direction:column; line-height:1.2; }
    .pin-name { font-size:12px; font-weight:700; }
    .pin-sub { font-size:10.2px; font-weight:600; color:var(--muted); }
    .village-pin[data-status="critical"] .pin-sub{color:var(--crit);} .village-pin[data-status="warning"] .pin-sub{color:var(--warn);} .village-pin[data-status="good"] .pin-sub{color:var(--good);}
    .pin-stem { width:2px; height:10px; background:var(--ink-soft); opacity:0.65; }

    #hud-shell { position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; padding:0 12px 12px; gap:8px; pointer-events:none; }
    .hud-box { pointer-events:auto; background:var(--surface); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); }
    .top-hud { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:0 -12px; padding:7px 16px; background:var(--solid); border-bottom:1px solid var(--border); pointer-events:auto; }
    .brand-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .brand-icon { width:30px; height:30px; border-radius:7px; background:#0f172a; color:#38bdf8; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .brand-title { margin:0; font-size:14.5px; font-weight:800; letter-spacing:-0.01em; }
    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-size:10.5px; font-weight:700; }
    .badge-pts { background:var(--brand-soft); border:1px solid rgba(3,105,161,0.35); color:var(--brand); cursor:pointer; }
    .badge-title-gold { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; cursor:pointer; }
    .badge-saved { display:none; background:var(--good-soft); border:1px solid var(--good-bd); color:var(--good); }
    .badge-saved.is-visible { display:inline-flex; }
    .jmp-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:5px; font-size:10px; font-weight:800; }
    .jmp-safe { background:var(--good-soft); color:var(--good); border:1px solid var(--good-bd); }
    .jmp-basic { background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-bd); }
    .jmp-lim { background:var(--crit-soft); color:var(--crit); border:1px solid var(--crit-bd); }

    .mode-switch { display:inline-flex; padding:2px; border-radius:8px; background:var(--muted-bg); border:1px solid var(--border); gap:2px; }
    .mode-btn { font:inherit; font-size:11px; font-weight:700; padding:4.5px 9px; border-radius:6px; border:none; background:transparent; color:var(--muted); cursor:pointer; }
    .mode-btn.is-active { background:var(--solid); color:var(--ink); box-shadow:0 1px 2px rgba(15,23,42,0.1); }
    .mode-btn.is-villager-active { background:var(--good); color:#fff; }
    .mode-btn.is-judge-active { background:#0f172a; color:#f8fafc; }

    .top-actions { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .hud-btn { font:inherit; font-size:11.3px; font-weight:600; padding:6px 9px; border-radius:7px; border:1px solid var(--border); background:var(--solid); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .hud-btn:hover { background:var(--muted-bg); border-color:var(--border-st); }
    .hud-btn-primary { background:var(--brand); border-color:var(--brand-dk); color:#fff; font-weight:700; }
    .hud-btn-urgent { background:var(--crit); border-color:#b91c1c; color:#fff; font-weight:700; }
    .hud-btn-green { background:#047857; border-color:#065f46; color:#fff; font-weight:700; }
    .hud-btn-shop { background:#0f766e; border-color:#115e59; color:#fff; font-weight:700; }
    .hud-btn-chat { background:#0284c7; border-color:#0369a1; color:#fff; font-weight:700; }
    .hud-btn-guide { background:#fef3c7; border-color:#f59e0b; color:#92400e; font-weight:800; }
    .hud-btn-night.is-active { background:#1e293b; border-color:#475569; color:#38bdf8; }
    .hud-btn-lite.is-active { background:#0f172a; border-color:#0f172a; color:#fff; }

    .sub-utility-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 12px; background:var(--surface); border:1px solid var(--border); border-radius:9px; pointer-events:auto; flex-wrap:wrap; }
    .judge-only-group { display:none; align-items:center; gap:5px; flex-wrap:wrap; }
    .judge-only-group.is-open { display:inline-flex; }

    .workspace-row { flex:1; min-height:0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; position:relative; }
    .left-panel { width:304px; max-height:100%; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
    .left-panel.is-collapsed { display:none; }
    .reopen-queue-btn { pointer-events:auto; display:none; }
    .reopen-queue-btn.is-visible { display:inline-flex; }
    .right-panel { width:414px; max-height:100%; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; user-select:text; margin-left:auto; }
    .right-panel.is-hidden { display:none; }

    .center-banners { position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:25; display:flex; flex-direction:column; align-items:center; gap:7px; pointer-events:none; max-width:500px; width:calc(100% - 24px); }
    .repair-alert-banner { width:100%; padding:10px 14px; border-radius:8px; background:#065f46; color:#fff; display:none; align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:auto; }
    .repair-alert-banner.is-open { display:flex; }
    .judge-tour-card { width:100%; padding:11px 14px; border-radius:10px; background:var(--solid); border:1px solid var(--border-st); border-top:3px solid var(--brand); box-shadow:var(--shadow); display:none; flex-direction:column; gap:7px; pointer-events:auto; }
    .judge-tour-card.is-open { display:flex; }
    .jt-steps { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
    .jt-step-btn { font:inherit; font-size:10.5px; font-weight:700; padding:5px 4px; border-radius:6px; border:1px solid var(--border); background:var(--soft); color:var(--muted); cursor:pointer; }
    .jt-step-btn.is-active { background:var(--brand); border-color:var(--brand); color:#fff; }

    .panel-header { padding:10px 12px 9px; border-bottom:1px solid var(--border); background:var(--soft); }
    .panel-head-top { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:7px; }
    .panel-title { margin:0; font-size:12px; font-weight:800; text-transform:uppercase; color:var(--ink-soft); }
    .filter-pills { display:flex; gap:4px; flex-wrap:wrap; }
    .filter-pill { font:inherit; font-size:10.8px; font-weight:600; padding:3.5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--solid); color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .filter-pill.is-active { background:#0f172a; border-color:#0f172a; color:#fff; }
    .dot { width:6.5px; height:6.5px; border-radius:50%; display:inline-block; }
    .dot-crit{background:var(--crit);} .dot-warn{background:var(--warn);} .dot-good{background:var(--good);}
    .village-list { padding:8px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
    .village-card-btn { font:inherit; text-align:left; width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--solid); color:var(--ink); cursor:pointer; display:flex; align-items:flex-start; gap:9px; }
    .village-card-btn.is-selected { border-color:var(--brand); background:var(--brand-soft); box-shadow:inset 3px 0 0 var(--brand); }
    .vcard-rank { min-width:25px; height:25px; border-radius:6px; font-size:10.8px; font-weight:800; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .vcard-rank.critical{background:var(--crit);} .vcard-rank.warning{background:var(--warn);} .vcard-rank.good{background:var(--good);}
    .vcard-body { flex:1; min-width:0; }
    .vcard-top { display:flex; align-items:center; justify-content:space-between; gap:5px; }
    .vcard-name { font-size:12.6px; font-weight:700; }
    .vcard-tag { font-size:9.8px; font-weight:700; padding:1.5px 6px; border-radius:4px; }
    .vcard-tag.critical{background:var(--crit-soft);color:var(--crit);} .vcard-tag.warning{background:var(--warn-soft);color:var(--warn);} .vcard-tag.good{background:var(--good-soft);color:var(--good);}
    .vcard-issue { margin:3px 0 5px; font-size:11.2px; color:var(--muted); line-height:1.36; }
    .vcard-meta { display:flex; gap:7px; flex-wrap:wrap; font-size:10.1px; font-weight:600; color:var(--ink-soft); }

    .detail-head { padding:12px 14px 10px; border-bottom:1px solid var(--border); background:var(--soft); display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .detail-badge-row { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:5px; }
    .priority-banner { display:inline-flex; padding:2px 7px; border-radius:5px; font-size:10.2px; font-weight:800; color:#fff; }
    .priority-banner.critical{background:var(--crit);} .priority-banner.warning{background:var(--warn);} .priority-banner.good{background:var(--good);}
    .detail-title { margin:0; font-size:16px; font-weight:800; }
    .detail-summary { margin:3px 0 0; font-size:11.1px; color:var(--muted); }
    .close-btn { font:inherit; width:27px; height:27px; border-radius:6px; border:1px solid var(--border); background:var(--solid); color:var(--muted); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .voice-btn { font:inherit; font-size:10.8px; font-weight:700; padding:3px 8px; border-radius:5px; border:1px solid var(--border-st); background:var(--solid); color:var(--ink); cursor:pointer; }
    .backup-water-box { background:var(--soft); border:1px solid var(--border); border-left:3.5px solid var(--brand); border-radius:8px; padding:8px 11px; display:flex; flex-direction:column; gap:3px; font-size:11.4px; }
    .wash-box { background:var(--soft); border:1px solid var(--border); border-left:3.5px solid #0d9488; border-radius:8px; padding:8px 11px; display:flex; flex-direction:column; gap:4px; font-size:11.3px; }
    .zone-chips { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
    .zone-chip { font:inherit; font-size:11px; font-weight:600; padding:5.5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--solid); color:var(--ink); cursor:pointer; text-align:left; }
    .zone-chip.is-active { background:#0f172a; border-color:#0f172a; color:#fff; }
    .inspector-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:3px; margin:8px 13px 4px; background:var(--muted-bg); border-radius:8px; border:1px solid var(--border); }
    .insp-tab { font:inherit; font-size:11px; font-weight:700; padding:6px 4px; border-radius:6px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:3px; }
    .insp-tab.is-active { background:var(--solid); color:var(--ink); }
    .tab-dot { display:inline-flex; align-items:center; justify-content:center; min-width:15px; height:15px; padding:0 4px; border-radius:4px; font-size:9.5px; font-weight:800; background:var(--brand-soft); color:var(--brand); }
    .inspector-scroll { padding:6px 13px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; flex:1; }
    .quick-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .metric-tile { background:var(--soft); border:1px solid var(--border); border-radius:8px; padding:7px 8px; }
    .metric-label { font-size:9.8px; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .metric-val { margin-top:2px; font-size:12.2px; font-weight:800; }
    .metric-val.is-crit{color:var(--crit);} .metric-val.is-warn{color:var(--warn);}
    .sub-pill-bar { display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:3px; background:var(--muted-bg); border:1px solid var(--border); border-radius:8px; }
    .sub-pill-bar-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px; background:var(--muted-bg); border:1px solid var(--border); border-radius:8px; }
    .sub-pill-btn { font:inherit; font-size:10.8px; font-weight:700; padding:5px 6px; border:none; border-radius:5px; background:transparent; color:var(--muted); cursor:pointer; }
    .sub-pill-btn.is-active { background:var(--solid); color:var(--ink); }
    .status-block { border-radius:8px; padding:8px 11px; background:var(--solid); border:1px solid var(--border); border-left-width:3.5px; }
    .status-block.broke{border-left-color:var(--crit);} .status-block.fix{border-left-color:var(--warn);}
    .status-block-title { margin:0 0 4px; font-size:11.6px; font-weight:800; }
    .status-list { margin:0; padding-left:16px; font-size:11.5px; color:var(--ink-soft); }
    .box-card { background:var(--soft); border:1px solid var(--border); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:7px; }
    .subsec-head { display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
    .subsec-title { margin:0; font-size:12px; font-weight:800; }
    .fund-track { width:100%; height:7px; background:var(--muted-bg); border-radius:4px; overflow:hidden; border:1px solid var(--border); }
    .fund-fill { height:100%; border-radius:3px; }
    .mini-link-btn { font:inherit; font-size:10.8px; font-weight:700; padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:var(--solid); color:var(--brand); cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .empty-inline { padding:11px; border-radius:6px; background:var(--solid); border:1px dashed var(--border-st); text-align:center; font-size:11.3px; color:var(--muted); }
    .repair-active-card { background:var(--brand-soft); border:1px solid rgba(3,105,161,0.3); border-left:3.5px solid var(--brand); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
    .repair-done-card { background:var(--good-soft); border:1px solid var(--good-bd); border-left:3.5px solid var(--good); border-radius:8px; padding:8px 10px; }
    .wq-guard { background:var(--solid); border:1px solid var(--border); border-left:3px solid #0d9488; border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; font-size:11.2px; }
    .valve-row,.ledger-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6.5px 9px; border-radius:6px; background:var(--solid); border:1px solid var(--border); font-size:11.4px; }
    .valve-btn { font:inherit; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:5px; border:none; cursor:pointer; color:#fff; }
    .valve-btn.is-open{background:var(--brand);} .valve-btn.is-shut{background:#475569;}
    .zoom-thumb { width:44px; height:44px; border-radius:6px; object-fit:cover; border:1px solid var(--border-st); cursor:zoom-in; flex-shrink:0; }
    .chat-row { display:flex; align-items:flex-start; gap:8px; }

          else if (dig === 8) { ctx.strokeRect(L, T0, R - L, M - T0); ctx.strokeRect(L, M, R - L, B - M); }
          else if (dig === 9) { ctx.strokeRect(L, T0, R - L, M - T0); ctx.moveTo(R, M); ctx.lineTo(R, B); ctx.lineTo(L + 1, B); }
          ctx.stroke();
          const v2 = normPatch(c, 28, 36); if (v2) list.push({ dig, vec:v2 });
        }
        return list;
      })();

      function recognizeRollerCells(binCanvas, cellsCount) {
        const ctx = binCanvas.getContext("2d"), sx0 = 22, sy0 = 2, sw = 196, sh = 40, cw = sw / cellsCount;
        const imgD = ctx.getImageData(sx0, sy0, sw, sh).data, digits = [], confs = [], midRolls = [];
        for (let idx = 0; idx < cellsCount; idx++) {
          const cx0 = Math.floor(idx * cw + cw * 0.09), cx1 = Math.ceil((idx + 1) * cw - cw * 0.11), cy0 = 2, cy1 = sh - 2;
          let xMin = cx1, yMin = cy1, xMax = cx0, yMax = cy0, ink = 0;
          for (let y = cy0; y < cy1; y++) for (let x = cx0; x < cx1; x++) if (imgD[(y * sw + x) * 4] === 0) {
            if (y <= 3 || y >= sh - 4) continue;
            ink++; if (x < xMin) xMin = x; if (x > xMax) xMax = x; if (y < yMin) yMin = y; if (y > yMax) yMax = y;
          }
          const area = (cx1 - cx0) * (cy1 - cy0);
          if (ink < 10 || ink > area * 0.78 || (yMax - yMin) < 9) { digits.push(""); confs.push(0); continue; }
          const gw = xMax - xMin + 1, gh = yMax - yMin + 1, cellCv = document.createElement("canvas"); cellCv.width = gw; cellCv.height = gh;
          const cc = cellCv.getContext("2d"), cd = cc.createImageData(gw, gh);
          for (let yy = 0; yy < gh; yy++) for (let xx = 0; xx < gw; xx++) {
            const isInk = imgD[((yMin + yy) * sw + (xMin + xx)) * 4] === 0 ? 255 : 0, o = (yy * gw + xx) * 4;
            cd.data[o] = cd.data[o + 1] = cd.data[o + 2] = isInk; cd.data[o + 3] = 255;
          }
          cc.putImageData(cd, 0, 0);
          const normCv = document.createElement("canvas"); normCv.width = 16; normCv.height = 20;
          const nx = normCv.getContext("2d"); nx.fillStyle = "#000"; nx.fillRect(0, 0, 16, 20);
          const padX = gw < gh * 0.42 ? Math.round((gh * 0.60 - gw) * 0.5) : 0, dw = Math.max(4, Math.min(16, Math.round((gw / (gw + padX * 2)) * 16))), ox = Math.round((16 - dw) * 0.5);
          nx.drawImage(cellCv, 0, 0, gw, gh, ox, 0, dw, 20);
          const fd = nx.getImageData(0, 0, 16, 20).data, vec = new Float32Array(320);
          let vNorm = 0;
          for (let i = 0; i < 320; i++) { const v = fd[i * 4] / 255.0; vec[i] = v; vNorm += v * v; }
          vNorm = Math.sqrt(vNorm) || 1;
          for (let i = 0; i < 320; i++) vec[i] /= vNorm;
          const bestByDig = new Float32Array(10);
          for (let t = 0; t < ROLLER_TEMPLATES.length; t++) { const tp = ROLLER_TEMPLATES[t]; let dot = 0; for (let i = 0; i < 320; i++) dot += vec[i] * tp.vec[i]; if (dot > bestByDig[tp.dig]) bestByDig[tp.dig] = dot; }
          let d1 = 0, s1 = -1, d2 = 0, s2 = -1, sumS = 0;
          for (let d = 0; d <= 9; d++) { sumS += bestByDig[d]; if (bestByDig[d] > s1) { s2 = s1; d2 = d1; s1 = bestByDig[d]; d1 = d; } else if (bestByDig[d] > s2) { s2 = bestByDig[d]; d2 = d; } }
          const margin = Math.max(0, s1 - sumS / 10);
          digits.push(String(d1));
          confs.push(Math.round(Math.max(0, Math.min(99, s1 * 72 + margin * 140))));
          if (idx === cellsCount - 1 && (s1 - s2) < 0.035 && Math.abs(d1 - d2) === 1) midRolls.push(Math.min(d1, d2) + "➔" + Math.max(d1, d2));
        }
        const valid = digits.filter(Boolean).length;
        return { pure:digits.join(""), digits, valid, avgConf:valid ? Math.round(confs.reduce((a, b) => a + b, 0) / cellsCount) : 0, midRoll:midRolls[0] || "" };
      }

      /* FIX #2: Truly Dynamic Seed on Monte Carlo N=100 Re-Run! */
      function runMonteCarlo100(newRandomSeed) {
        if (newRandomSeed) mcSeed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
        let seed = mcSeed;
        const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
        const redTriage = [], redFull = [], p10Base = [], p10Full = [];
        for (let i = 0; i < 100; i++) {
          const qSmall = 110 + rnd() * 220, qMed = 900 + rnd() * 950, qBig = 3100 + rnd() * 2600;
          const waitH = 18 + rnd() * 24, t1 = Math.min(72, waitH), t2 = Math.min(72, waitH * 2), t3 = 72;
          const lBase = qSmall * t1 + qMed * t2 + qBig * t3, lTri = qBig * t1 + qMed * t2 + qSmall * t3;
          const pStep = Math.max(3.5, waitH * (0.16 + rnd() * 0.08));
          const lFul = qBig * pStep + qMed * (pStep * 2) + qSmall * Math.min(72, pStep * 3);
          redTriage.push((1 - lTri / lBase) * 100); redFull.push((1 - lFul / lBase) * 100);
          const qN = qBig / (140 * 9.5), hf = 0.72 * Math.pow(qN, 1.852), el = (32 + rnd() * 22) / 100 * 0.98;
          p10Base.push(Math.max(0.18, 2.25 - hf - el - 0.18 - 0.12 * Math.pow(qN, 1.852)));
          p10Full.push(Math.min(2.2, 2.25 - 0.06 - el + 0.45 - 0.18));
        }
        const ms = a => { const m = a.reduce((s,x)=>s+x,0)/a.length, sd = Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length); return { m:m.toFixed(1), sd:sd.toFixed(1), m2:m.toFixed(2), sd2:sd.toFixed(2) }; };
        mcStats = { tri:ms(redTriage), ful:ms(redFull), pb:ms(p10Base), pf:ms(p10Full), seed:mcSeed };
      }

        if (isAutoTourPlaying) { stopAutoTour(); renderJudgeTourCopy(currentJudgeStep); return; }
        isAutoTourPlaying = true; renderJudgeTourCopy(currentJudgeStep);
        autoTourTimer = setInterval(() => { if (currentJudgeStep < 4) runJudgeStep(currentJudgeStep + 1); else { stopAutoTour(); renderJudgeTourCopy(4); } }, 4200);
      };
      byId("btn-jt-action").onclick = () => {
        if (currentJudgeStep === 1) byId("btn-open-ocr").click();
        else if (currentJudgeStep === 2) byId("btn-open-parts").click();
        else if (currentJudgeStep === 3) byId("btn-open-sms").click();
        else byId("btn-open-impact").click();
      };
      document.querySelectorAll(".filter-pill").forEach(p => p.onclick = () => { activeFilter=p.getAttribute("data-filter"); document.querySelectorAll(".filter-pill").forEach(x=>x.classList.toggle("is-active",x===p)); renderQueue(); updatePins(); });
      document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => byId(b.getAttribute("data-close")).classList.remove("is-open"));
      document.querySelectorAll(".modal-backdrop").forEach(m => m.onclick = e => { if(e.target===m) m.classList.remove("is-open"); });

      byId("btn-reset-demo").onclick = () => {
        if (!isResetConfirming) { isResetConfirming=true; applyAllTranslations(); setTimeout(()=>{isResetConfirming=false;applyAllTranslations();},3000); return; }
        stopAutoTour(); isResetConfirming=false; try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
        VILLAGES=JSON.parse(INIT_JSON); PARTS_POOL=JSON.parse(INIT_PARTS_JSON);
        commentsByVillage={}; repairsByVillage={}; stepValvesByVillage={}; smsByVillage={}; ledgerByVillage={}; redeemedVouchers=[]; ocrTrialLogs=[]; activeCustomTitle=""; unlockedTitles=[]; stewardPoints=0; seasonMode="normal"; lastEspTelemetry="";
        byId("judge-tour-card").classList.remove("is-open"); byId("repair-alert-banner").classList.remove("is-open");
        if (window._seedGlobalCalibration) window._seedGlobalCalibration();
        rebuildVillages3D(); buildPins(); resetOverview(); applyAllTranslations();
      };

      initHwModalDom();
      loadState();
      if (window._seedGlobalCalibration) window._seedGlobalCalibration();
      buildPins();
      applyAllTranslations();
      renderCv();
      init3D();
    })();
  </script>
</body>
</html>
