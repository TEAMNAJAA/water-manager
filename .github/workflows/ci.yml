name: ci

on:
  push:
  pull_request:

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts for the synthetic meters (optional)
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          timeout 240 bash -c "sudo apt-get $APT update -qq && sudo apt-get $APT install -y fonts-dejavu-core fonts-liberation fonts-freefont-ttf" \
            || echo "::warning::fonts not installed; the meter renderer uses its built-in font"
      - run: pip install -r requirements.txt
      - run: pytest -q tests

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts for the synthetic meters (optional)
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          timeout 240 bash -c "sudo apt-get $APT update -qq && sudo apt-get $APT install -y fonts-dejavu-core fonts-liberation fonts-freefont-ttf" \
            || echo "::warning::fonts not installed; the meter renderer uses its built-in font"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t namjai-server .
      - run: |
          docker run -d -p 7860:7860 --name namjai namjai-server
          for i in $(seq 30); do curl -sf localhost:7860/health && curl -sf localhost:7860/demo | grep -q '<div id="root">' && exit 0; sleep 1; done
          docker logs namjai; exit 1

  hardware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: timeout 600 bash -c "until sudo apt-get -o Acquire::http::Timeout=20 update -qq && sudo apt-get -o Acquire::http::Timeout=20 install -y openscad; do sleep 15; done"
      - run: |
          cd hardware
          openscad -o hood.stl hood.scad
          openscad -o test-ring.stl -D 'part="test_ring"' hood.scad
      - uses: actions/upload-artifact@v4
        with:
          name: namjai-hood-stl
          path: hardware/*.stl

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: namjai-clip-firmware
          path: firmware/.pio/build/esp32cam/firmware.bin
